spring:
  application:
    name: students-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/students_db
    username: root
    password: 123456$

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  config:
    import:
      - optional:configserver:http://localhost:8888
server:
  port: 8081
